name: Generate Physics 9 DOCX

on:
  push:
    branches:
      - generated-plan-physics9-2026-2027
    paths:
      - .github/workflows/generate-physics9-docx.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: generated-plan-physics9-2026-2027
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-docx
      - name: Generate DOCX
        shell: bash
        run: |
          python - <<'PY'
          from docx import Document
          from docx.shared import Cm, Pt, RGBColor
          from docx.enum.section import WD_ORIENT
          from docx.enum.text import WD_ALIGN_PARAGRAPH
          from docx.enum.table import WD_TABLE_ALIGNMENT, WD_CELL_VERTICAL_ALIGNMENT
          from docx.oxml import OxmlElement
          from docx.oxml.ns import qn
          from pathlib import Path

          out = Path('generated/physics9_term1_plan_2026_2027.docx')
          out.parent.mkdir(parents=True, exist_ok=True)

          rows = [
              ('6-10/9/2026','الأولى: الطول والزمن','1-1 أهمية القياس','1',''),
              ('6-10/9/2026','الأولى: الطول والزمن','1-2 قياس الطول والحجم','',''),
              ('6-10/9/2026','الأولى: الطول والزمن','1-3 قياس الزمن','1',''),
              ('13-17/9/2026','الثانية: الحركة','2-1 فهم السرعة','1',''),
              ('13-17/9/2026','الثانية: الحركة','2-2 التمثيل البياني (المسافة / الزمن)','2',''),
              ('20-24/9/2026','الثانية: الحركة','2-3 فهم التسارع','2',''),
              ('27/9-1/10/2026','الثانية: الحركة','2-4 حساب السرعة والتسارع','2',''),
              ('4-8/10/2026','الثالثة: الكتلة والوزن','3-1 الكتلة والوزن والجاذبية','2',''),
              ('11-15/10/2026','الرابعة: الكثافة','4-1 الكثافة','1',''),
              ('11-15/10/2026','الخامسة: نموذج الحركة الجزيئية البسيطة للمادة','5-1 حالات المادة','1',''),
              ('18-22/10/2026','الخامسة: نموذج الحركة الجزيئية البسيطة للمادة','5-2 نموذج الحركة الجزيئية البسيطة للمادة','1',''),
              ('18-22/10/2026','الخامسة: نموذج الحركة الجزيئية البسيطة للمادة','5-3 القوى والنظرية الجزيئية البسيطة للمادة','1',''),
              ('25-29/10/2026','الخامسة: نموذج الحركة الجزيئية البسيطة للمادة','5-4 المواد الغازية ونموذج الحركة الجزيئية البسيط للمادة','1',''),
              ('1-5/11/2026','السادسة: المادة والخصائص الحرارية','6-1 التمدد الحراري','2',''),
              ('8-12/11/2026','السابعة: قياس درجة الحرارة','7-1 درجة الحرارة وموازين الحرارة','2',''),
              ('15-19/11/2026','السابعة: قياس درجة الحرارة','7-2 تصميم ميزان حرارة','1',''),
              ('15-19/11/2026','الثامنة: الطاقة','8-1 التغيرات في الطاقة','1',''),
              ('22-26/11/2026','الثامنة: الطاقة','8-2 تطبيقات على تغيرات الطاقة','1','إجازة اليوم الوطني: 25-26 نوفمبر 2026م'),
              ('22-26/11/2026','الثامنة: الطاقة','8-3 حفظ الطاقة','1','إجازة اليوم الوطني: 25-26 نوفمبر 2026م'),
              ('29/11-3/12/2026','الثامنة: الطاقة','8-4 حسابات الطاقة','2',''),
              ('6-10/12/2026','الثامنة: الطاقة','8-5 القدرة','2',''),
              ('6-10/12/2026','الثامنة: الطاقة','8-6 حساب القدرة','1',''),
              ('6-10/12/2026','التاسعة: انتقال الطاقة','9-1 التوصيل','1',''),
              ('13-17/12/2026','التاسعة: انتقال الطاقة','9-2 الحمل الحراري','1',''),
              ('13-17/12/2026','التاسعة: انتقال الطاقة','9-3 الإشعاع','1',''),
              ('13-17/12/2026','العاشرة: التطبيقات والآثار المترتبة على نقل الطاقة','10-1 بعض التطبيقات والآثار المترتبة على نقل الطاقة','1',''),
              ('13-17/12/2026','مراجعة عامة','مراجعة عامة','',''),
          ]

          def set_rtl_p(p, align=WD_ALIGN_PARAGRAPH.RIGHT):
              p.alignment = align
              pPr = p._p.get_or_add_pPr()
              bidi = pPr.find(qn('w:bidi'))
              if bidi is None:
                  bidi = OxmlElement('w:bidi'); pPr.append(bidi)
              bidi.set(qn('w:val'),'1')
              p.paragraph_format.space_before = Pt(0)
              p.paragraph_format.space_after = Pt(0)

          def set_run(run, size=9, bold=False, color=None):
              run.font.name = 'Arial'
              run.font.size = Pt(size)
              run.bold = bold
              if color: run.font.color.rgb = RGBColor.from_string(color)
              rPr = run._element.get_or_add_rPr()
              rFonts = rPr.find(qn('w:rFonts'))
              if rFonts is None:
                  rFonts = OxmlElement('w:rFonts'); rPr.insert(0,rFonts)
              for k in ('w:ascii','w:hAnsi','w:eastAsia','w:cs'): rFonts.set(qn(k),'Arial')
              rtl = rPr.find(qn('w:rtl'))
              if rtl is None:
                  rtl = OxmlElement('w:rtl'); rPr.append(rtl)
              rtl.set(qn('w:val'),'1')

          def shade(cell, fill):
              tcPr = cell._tc.get_or_add_tcPr()
              shd = tcPr.find(qn('w:shd'))
              if shd is None:
                  shd = OxmlElement('w:shd'); tcPr.append(shd)
              shd.set(qn('w:fill'),fill)

          def margins(cell, top=55, start=60, bottom=55, end=60):
              tcPr = cell._tc.get_or_add_tcPr()
              tcMar = tcPr.first_child_found_in('w:tcMar')
              if tcMar is None:
                  tcMar = OxmlElement('w:tcMar'); tcPr.append(tcMar)
              for m,v in [('top',top),('start',start),('bottom',bottom),('end',end)]:
                  node = tcMar.find(qn('w:'+m))
                  if node is None:
                      node = OxmlElement('w:'+m); tcMar.append(node)
                  node.set(qn('w:w'),str(v)); node.set(qn('w:type'),'dxa')

          def put(cell,text,size=8.5,bold=False,center=False):
              cell.text=''
              p=cell.paragraphs[0]
              set_rtl_p(p, WD_ALIGN_PARAGRAPH.CENTER if center else WD_ALIGN_PARAGRAPH.RIGHT)
              r=p.add_run(text); set_run(r,size,bold)
              cell.vertical_alignment=WD_CELL_VERTICAL_ALIGNMENT.CENTER
              margins(cell)

          doc=Document()
          sec=doc.sections[0]
          sec.orientation=WD_ORIENT.LANDSCAPE
          sec.page_width,sec.page_height=sec.page_height,sec.page_width
          sec.top_margin=Cm(0.7); sec.bottom_margin=Cm(0.7); sec.left_margin=Cm(0.6); sec.right_margin=Cm(0.6)

          p=doc.add_paragraph(); set_rtl_p(p,WD_ALIGN_PARAGRAPH.CENTER)
          r=p.add_run('الخطة الفصلية لمادة الفيزياء - الصف التاسع'); set_run(r,16,True,'17365D')
          p=doc.add_paragraph(); set_rtl_p(p,WD_ALIGN_PARAGRAPH.CENTER)
          r=p.add_run('الفصل الدراسي الأول - العام الدراسي 2026/2027م'); set_run(r,11,True,'244062')
          p.paragraph_format.space_after=Pt(5)

          table=doc.add_table(rows=2, cols=9)
          table.style='Table Grid'; table.alignment=WD_TABLE_ALIGNMENT.CENTER; table.autofit=False
          hdr0=table.rows[0].cells; hdr1=table.rows[1].cells
          # Header merges
          hdr0[0].merge(hdr1[0]); hdr0[1].merge(hdr1[1]); hdr0[2].merge(hdr1[2]); hdr0[3].merge(hdr1[3]); hdr0[4].merge(hdr0[7]); hdr0[8].merge(hdr1[8])
          put(hdr0[0],'الفترة الزمنية',9,True,True)
          put(hdr0[1],'الوحدة الدراسية / المحور',9,True,True)
          put(hdr0[2],'الموضوعات',9,True,True)
          put(hdr0[3],'عدد الحصص',9,True,True)
          put(hdr0[4],'أدوات التقويم',9,True,True)
          put(hdr0[8],'الملاحظات',9,True,True)
          for c,t in zip(hdr1[4:8],['الحوار الشفوي','الواجب المنزلي','النشاط العملي','الاختبار القصير']): put(c,t,8,True,True)
          for c in table.rows[0].cells + table.rows[1].cells: shade(c,'8EA9DB')

          for idx,(period,unit,topic,count,note) in enumerate(rows):
              row=table.add_row().cells
              fill='F7F9FC' if idx%2==0 else 'FFFFFF'
              for c in row: shade(c,fill)
              put(row[0],period,8,False,True)
              put(row[1],unit,8,True,False)
              put(row[2],topic,8.5,False,False)
              put(row[3],count,9,True,True)
              for j in range(4,8): put(row[j],'',8,False,True)
              put(row[8],note,7.8,bool(note),True)

          # Merge the original shared session cell for 1-1 and 1-2
          data_start=2
          table.cell(data_start,3).merge(table.cell(data_start+1,3))
          put(table.cell(data_start,3),'1',9,True,True)
          # Merge notes for the National Day week
          nd1=data_start+17; nd2=data_start+18
          table.cell(nd1,8).merge(table.cell(nd2,8))
          put(table.cell(nd1,8),'إجازة اليوم الوطني: 25-26 نوفمبر 2026م',7.8,True,True)

          # Widths
          widths=[3.0,4.4,8.3,1.7,1.9,1.9,1.9,1.9,3.8]
          for row in table.rows:
              for c,w in zip(row.cells,widths): c.width=Cm(w)

          doc.add_paragraph()
          sig=doc.add_table(rows=1,cols=3); sig.alignment=WD_TABLE_ALIGNMENT.CENTER
          for c,t in zip(sig.rows[0].cells,['المعلم','المشرف / المعلم الأول','مدير المدرسة']):
              put(c,t+'\n\nالتوقيع: __________________',9,True,True); shade(c,'F3F6F9')

          doc.save(out)
          print(out)
          PY
      - name: Commit generated DOCX
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/physics9_term1_plan_2026_2027.docx
          git commit -m "docs: generate physics 9 plan docx" || exit 0
          git push origin generated-plan-physics9-2026-2027
