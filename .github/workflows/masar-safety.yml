name: Masar Safety Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  safety-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Masar safety check
        run: python check_masar_safety.py app.py
