name: Masar Safety Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  safety-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt "pytest>=8,<9"

      - name: Verify conftest filename
        run: |
          python - <<'PY'
          from pathlib import Path

          matches = [p.name for p in Path("tests").glob("conftest.py*")]
          print("conftest matches:", [repr(name) for name in matches])

          assert matches == ["conftest.py"], f"Unexpected conftest filenames: {matches!r}"
          PY

      - name: Run Masar safety check
        run: python check_masar_safety.py app.py

      - name: Run pytest
        run: python -m pytest -vv --tb=short